async function all(table,select='*',filters=[]){let out=[],from=0;for(let i=0;i<30;i++){let q=sb.from(table).select(select);filters.forEach(f=>q=q[f[0]](...f.slice(1)));const orderCol=table==='teacher_appraisal_frequency_history'?'changed_at':(table==='teacher_notes'||table==='teacher_private_notes'?'updated_at':'created_at');const r=await q.order(orderCol,{ascending:true}).range(from,from+999);if(r.error)throw r.error;out=out.concat(r.data||[]);if(!r.data||r.data.length<1000)break;from+=1000;}return out;}
async function loadConfig(){configs=await all('teacher_appraisal_configs');configs.sort((a,b)=>b.version-a.version);config=configs.find(x=>x.status==='published')||configs[0]||null;configDraft=config?JSON.parse(JSON.stringify(config.config)):null;}
async function loadBase(){const names=['teachers','students','subjects','student_subjects','student_subject_frequency','sessions','scheduled_classes','study_plans','homework','teacher_research_notes','teacher_resources','app_events','ai_usage_log','teacher_leave','teacher_availability','profiles','teacher_appraisal_frequency_history','teacher_notes'];const vals=await Promise.all(names.map(t=>all(t)));names.forEach((k,i)=>source[k]=vals[i]);teachers=source.teachers.filter(t=>!t.archived).sort((a,b)=>a.name.localeCompare(b.name));}

function categorySubs(c){return c.subcategories||[{id:c.id+'_general',name:'General',weight:c.weight,metrics:c.metrics||[]}];}
function metricList(cfg){return (cfg?.categories||[]).flatMap(c=>categorySubs(c).flatMap(sc=>(sc.metrics||[]).map(m=>({...m,category_id:c.id,category_name:c.name,category_weight:c.weight,subcategory_id:sc.id,subcategory_name:sc.name,subcategory_weight:sc.weight}))));}
function periodDays(start,end){const out=[];let d=new Date(start+'T12:00:00');const stop=new Date(end+'T12:00:00');while(d<=stop){out.push(new Date(d));d.setDate(d.getDate()+1);}return out;}

function teacherPairs(teacherId){const subj=source.subjects.filter(s=>s.teacher_id===teacherId);const ids=new Set(subj.map(s=>s.id));return source.student_subjects.filter(x=>ids.has(x.subject_id)&&source.students.some(st=>st.id===x.student_id&&!st.archived)).map(x=>({student_id:x.student_id,subject_id:x.subject_id,student:source.students.find(st=>st.id===x.student_id),subject:subj.find(s=>s.id===x.subject_id),enrolled_at:x.enrolled_at||x.created_at?.slice(0,10)||'2020-01-01',frequency:frequencyFor(x.student_id,x.subject_id)}));}
function frequencyRecordAt(pair,day){const events=source.teacher_appraisal_frequency_history.filter(x=>x.student_id===pair.student_id&&x.subject_id===pair.subject_id).sort((a,b)=>String(a.changed_at).localeCompare(String(b.changed_at)));const cutoff=day+'T23:59:59+05:30';if(events.length){const before=events.filter(x=>String(x.changed_at)<=cutoff);if(before.length){const last=before[before.length-1];return last.operation==='DELETE'?null:last.new_record;}const first=events[0];if(first.operation==='UPDATE'||first.operation==='DELETE')return first.old_record||null;return null;}const row=pair.frequency;if(!row)return null;if(String(row.created_at||'').slice(0,10)>day)return null;if(String(row.updated_at||row.created_at||'').slice(0,10)>day)return undefined;return row;}
function freqExpected(pair,start,end){const counts=['sunday_count','monday_count','tuesday_count','wednesday_count','thursday_count','friday_count','saturday_count'];let total=0,unknownDays=0,configuredDays=0;for(const d of periodDays(start,end)){const day=d.toISOString().slice(0,10);if(day<pair.enrolled_at)continue;const row=frequencyRecordAt(pair,day);if(row===undefined){unknownDays++;continue;}if(!row)continue;configuredDays++;total+=n(row[counts[d.getDay()]]);}return {total,unknownDays,configuredDays};}
function sessionsFor(teacherId,start,end){return source.sessions.filter(s=>s.teacher_id===teacherId&&s.date>=start&&s.date<=end);}
function scheduledFor(teacherId,start,end){return source.scheduled_classes.filter(s=>s.teacher_id===teacherId&&s.date>=start&&s.date<=end&&s.date<=dateNow()&&String(s.status||'').toLowerCase()!=='cancelled');}
function matchSession(sc,sessions){return sessions.find(s=>sc.linked_session_id&&s.id===sc.linked_session_id)||sessions.find(s=>s.date===sc.date&&s.student_id===sc.student_id&&s.subject_id===sc.subject_id&&s.teacher_id===sc.teacher_id);}
function metricResult(metric,teacherId,start,end){
 const ss=sessionsFor(teacherId,start,end),sc=scheduledFor(teacherId,start,end),pairs=teacherPairs(teacherId);
 let value=null,detail=[],percent=null,coverage='available',note='';
 const present=ss.filter(s=>['present','absent'].includes(String(s.status||'').toLowerCase()));
 if(metric.id==='frequency_adherence'){
  let expected=0,actual=0,unconfigured=[];
  pairs.forEach(p=>{const e=freqExpected(p,start,end);if(!e||!e.configuredDays||e.unknownDays){unconfigured.push(p);}expected+=e?.total||0;actual+=present.filter(s=>s.student_id===p.student_id&&s.subject_id===p.subject_id).reduce((a,s)=>a+n(s.count),0);});
  percent=expected?Math.min(100,actual/expected*100):(unconfigured.length?0:100);if(unconfigured.length&&!unconfigured.some(p=>(freqExpected(p,start,end)?.unknownDays||0)>0)&&pairs.length){percent=percent*(pairs.length-unconfigured.length)/pairs.length;}if(!expected&&!unconfigured.length){coverage='not_applicable';note='No configured weekly class frequency applies in this period.';}if(unconfigured.some(p=>(freqExpected(p,start,end)?.unknownDays||0)>0)){coverage='admin_review';percent=null;note='Historical class-frequency changes cannot be reconstructed for part of this period. Admin review is required; no automatic deduction is applied for missing historical tracking.';}else if(unconfigured.length)note=unconfigured.length+' student-subject frequency records have no configured frequency; these are shown as data gaps and reduce frequency-adherence scoring.';
  value={expected,actual,unconfigured:unconfigured.length};detail=pairs.map(p=>{const e=freqExpected(p,start,end);const rows=present.filter(s=>s.student_id===p.student_id&&s.subject_id===p.subject_id);const a=rows.reduce((x,s)=>x+n(s.count),0);return {student:p.student?.name||'Student',subject:p.subject?.name||'Subject',expected:e?.total??null,actual:a,shortfall:e?.total==null?null:Math.max(0,e.total-a),class_types:[...new Set(rows.map(s=>s.class_type).filter(Boolean))].join(', '),delivery_modes:[...new Set(rows.map(s=>s.mode).filter(Boolean))].join(', '),unknown_history_days:e?.unknownDays||0,frequency_configured_days:e?.configuredDays||0,status:!e||!e.configuredDays?'Frequency not configured':e.unknownDays?'Historical frequency unavailable':a>=e.total?'Met':'Shortfall'};});
 }else if(['overall_delivery','attendance_completeness'].includes(metric.id)){
  const matched=sc.map(x=>({schedule:x,session:matchSession(x,ss)}));const done=matched.filter(x=>x.session&&['present','absent'].includes(String(x.session.status||'').toLowerCase())).length;const due=sc.length;
  percent=due?done/due*100:100;if(!due){coverage='not_applicable';note='No due scheduled classes in this period.';}value={expected:due,conducted:done,missing:due-done};detail=matched.map(x=>({date:x.schedule.date,student:source.students.find(s=>s.id===x.schedule.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.schedule.subject_id)?.name||'—',class_type:x.schedule.class_type,delivery_mode:x.session?.mode||'—',scheduled_status:x.schedule.status,attendance:x.session?.status||'Missing',session_id:x.session?.id||null}));if(!due)note='No due scheduled-class rows exist in this period; no delivery percentage can be calculated.';
 }else if(metric.id==='attendance_timeliness'){
  const matched=sc.map(x=>({schedule:x,session:matchSession(x,ss)}));let weighted=0,valid=0,late=[],missing=[];
  matched.forEach(x=>{if(!x.session){missing.push(x.schedule);valid++;weighted+=n(metric.missing_score_percent??0);return;}const time=x.schedule.time||'23:59:59';const due=new Date(x.schedule.date+'T'+time+'+05:30').getTime()+(n(metric.deadline_hours??24)+n(metric.grace_hours??0))*3600000;const entered=new Date(x.session.created_at).getTime();const hrs=(entered-new Date(x.schedule.date+'T'+time+'+05:30').getTime())/3600000;const fullLimit=n(metric.deadline_hours??24)+n(metric.grace_hours??0);const band=(metric.bands||[]).find(b=>hrs<=n(b.max_hours));const pct=hrs<=fullLimit?100:(band?n(band.score_percent):0);weighted+=pct;valid++;if(pct<100)late.push({date:x.schedule.date,student:source.students.find(s=>s.id===x.schedule.student_id)?.name||'—',hours:Math.round(hrs*10)/10,score_percent:pct,session_id:x.session.id});});
  // A missing session is a missing attendance submission and scores zero.
  percent=valid?weighted/valid:100;if(!valid){coverage='not_applicable';note='No due classes in this period.';}value={due:valid,on_time:valid-late.length-missing.length,late:late.length,missing:missing.length};detail=late.concat(missing.map(x=>({date:x.date,student:source.students.find(s=>s.id===x.student_id)?.name||'—',class_type:x.class_type,delivery_mode:'—',hours:null,score_percent:n(metric.missing_score_percent??0),status:'Attendance missing'})));if(!valid)note='No due classes in this period.';
 }else if(metric.id==='study_plan_quality'){
  const plans=source.study_plans.filter(p=>p.teacher_id===teacherId&&((p.created_at?.slice(0,10)>=start&&p.created_at?.slice(0,10)<=end)||(p.updated_at?.slice(0,10)>=start&&p.updated_at?.slice(0,10)<=end)));let total=0,done=0;
  plans.forEach(p=>(p.items||[]).forEach(i=>{total++;if(i.status==='done')done++;}));percent=total?done/total*100:100;if(!total){coverage='not_applicable';note='No Study Plan topic items were available to assess; missing plan coverage is assessed separately.';}value={plans:plans.length,topics:total,completed:done};detail=plans.map(p=>({student:source.students.find(s=>s.id===p.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===p.subject_id)?.name||'—',topics:(p.items||[]).length,completed:(p.items||[]).filter(i=>i.status==='done').length,updated_at:p.updated_at}));
 }else if(metric.id==='homework_quality'){
  const hw=source.homework.filter(h=>h.teacher_id===teacherId&&h.assigned_date>=start&&h.assigned_date<=end);const reviewed=hw.filter(h=>h.reviewed_at||h.teacher_feedback);percent=hw.length?reviewed.length/hw.length*100:100;if(!hw.length){coverage='not_applicable';note='No homework was assigned in this period; no automatic penalty is applied.';}value={assigned:hw.length,reviewed:reviewed.length,pending:hw.length-reviewed.length};detail=hw.map(h=>({student:source.students.find(s=>s.id===h.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===h.subject_id)?.name||'—',title:h.title,status:h.status,reviewed_at:h.reviewed_at}));
 }else if(metric.id==='teacher_app_adoption'){
  const ev=source.app_events.filter(e=>e.role==='Teacher'&&e.linked_id===teacherId&&e.created_at>=start+'T00:00:00'&&e.created_at<=end+'T23:59:59');const features=[...new Set(ev.map(e=>e.feature).filter(f=>f&&!String(f).startsWith('tab:')&&!String(f).startsWith('teacher.tip.shown:')))];const target=n(metric.target)||1;percent=Math.min(100,features.length/target*100);value={events:ev.length,distinct_features:features.length,target_features:target};detail=features.map(f=>({feature:f,events:ev.filter(e=>e.feature===f).length}));
 }else if(metric.id==='ai_adoption'){
  const prof=source.profiles.find(p=>p.linked_teacher_id===teacherId&&p.role==='Teacher');if(prof&&prof.ai_enabled===false){coverage='not_applicable';percent=100;note='AI access is disabled for this teacher; metric is not applicable and receives neutral full credit.';}else{const logs=source.ai_usage_log.filter(e=>e.teacher_id===teacherId&&e.role==='Teacher'&&e.created_at>=start+'T00:00:00'&&e.created_at<=end+'T23:59:59'&&e.ok);const target=n(metric.target)||1;percent=Math.min(100,logs.length/target*100);value={successful_calls:logs.length,target};detail=logs.map(e=>({feature:e.feature,model:e.model,created_at:e.created_at}));}
 }else if(metric.id==='research_notes'){
  const rows=source.teacher_research_notes.filter(x=>x.teacher_id===teacherId&&!x.hidden&&x.created_at>=start+'T00:00:00'&&x.created_at<=end+'T23:59:59');const target=n(metric.target)||1;percent=Math.min(100,rows.length/target*100);value={count:rows.length,target};detail=rows.map(x=>({subject:x.subject_name,chapter:x.chapter,focus:x.focus,created_at:x.created_at}));
 }else if(metric.id==='teaching_resources'){
  const rows=source.teacher_resources.filter(x=>x.teacher_id===teacherId&&x.created_at>=start+'T00:00:00'&&x.created_at<=end+'T23:59:59');const target=n(metric.target)||1;percent=Math.min(100,rows.length/target*100);value={count:rows.length,target};detail=rows.map(x=>({title:x.title,subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',shared:x.shared,created_at:x.created_at}));
 }else if(metric.id==='study_plan_compliance'){
  const plans=source.study_plans.filter(p=>p.teacher_id===teacherId&&p.created_at?.slice(0,10)<=end);const byPair=new Set(plans.map(p=>p.student_id+'|'+p.subject_id));const relevant=pairs.filter(p=>p.enrolled_at<=end);const covered=relevant.filter(p=>byPair.has(p.student_id+'|'+p.subject_id));percent=relevant.length?covered.length/relevant.length*100:null;value={expected:relevant.length,entered:covered.length,missing:relevant.length-covered.length};detail=relevant.map(p=>({student:p.student?.name||'—',subject:p.subject?.name||'—',status:byPair.has(p.student_id+'|'+p.subject_id)?'Entered':'Missing'}));
 }else if(metric.id==='attendance_completeness'){
  const matched=sc.map(x=>({schedule:x,session:matchSession(x,ss)}));percent=sc.length?matched.filter(x=>x.session).length/sc.length*100:null;value={expected:sc.length,entered:matched.filter(x=>x.session).length,missing:matched.filter(x=>!x.session).length};detail=matched.filter(x=>!x.session).map(x=>({date:x.schedule.date,student:source.students.find(s=>s.id===x.schedule.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.schedule.subject_id)?.name||'—',status:'Missing attendance'}));
 }else if(metric.method==='admin_review'){
  coverage='admin_review';note='Admin assessment required. Enter a score and supporting observation before finalisation.';
  if(metric.id==='schedule_management'||metric.id==='class_record_reconciliation'){detail=sc.map(x=>({date:x.date,student:source.students.find(s=>s.id===x.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',status:x.status,linked_session_id:x.linked_session_id||null,session_found:!!matchSession(x,ss)}));}
  else if(metric.id==='student_attendance'){detail=ss.map(x=>({date:x.date,student:source.students.find(s=>s.id===x.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',attendance_status:x.status,class_type:x.class_type,delivery_mode:x.mode}));}
  else if(metric.id==='absence_followup'){const abs=ss.filter(x=>String(x.status).toLowerCase()==='absent');detail=abs.map(x=>({date:x.date,student:source.students.find(s=>s.id===x.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',remarks:x.remarks||'No recorded follow-up in attendance remarks'}));if(!abs.length){coverage='not_applicable';note='No student absences were recorded in this period; absence follow-up is not applicable.';percent=100;}}
  else if(metric.id==='learning_support'){detail=source.study_plans.filter(x=>x.teacher_id===teacherId).map(x=>({student:source.students.find(s=>s.id===x.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',topics:(x.items||[]).length,updated_at:x.updated_at}));}
  else if(metric.id==='schedule_discipline'){detail=source.teacher_availability.filter(x=>x.teacher_id===teacherId).map(x=>({weekday:x.weekday,start_time:x.start_time,end_time:x.end_time}));}
  else if(metric.id==='leave_management'){detail=source.teacher_leave.filter(x=>x.teacher_id===teacherId&&x.end_date>=start&&x.start_date<=end).map(x=>({start_date:x.start_date,end_date:x.end_date,reason:x.reason,created_at:x.created_at}));}
  else if(metric.id==='professional_records'){detail=source.teacher_notes.filter(x=>String(x.teacher_id)===String(teacherId)).map(x=>({student_id:x.student_id,updated_at:x.updated_at,note:x.note}));}
  else if(metric.id==='homework_compliance'){detail=source.homework.filter(x=>x.teacher_id===teacherId&&x.assigned_date>=start&&x.assigned_date<=end).map(x=>({student:source.students.find(s=>s.id===x.student_id)?.name||'—',subject:source.subjects.find(s=>s.id===x.subject_id)?.name||'—',title:x.title,status:x.status,reviewed_at:x.reviewed_at}));}
  else if(metric.id==='research_resource_compliance'){detail=source.teacher_research_notes.filter(x=>x.teacher_id===teacherId&&x.created_at>=start+'T00:00:00'&&x.created_at<=end+'T23:59:59').map(x=>({type:'Research',subject:x.subject_name,chapter:x.chapter,created_at:x.created_at})).concat(source.teacher_resources.filter(x=>x.teacher_id===teacherId&&x.created_at>=start+'T00:00:00'&&x.created_at<=end+'T23:59:59').map(x=>({type:'Resource',title:x.title,shared:x.shared,created_at:x.created_at})));}
  value={evidence_count:detail.length};
}else if(metric.method!=='admin_review'){
  const table=String(metric.source||'').split('.')[0];const rows=source[table]||[];const dateField=metric.date_field||(rows[0]?.assigned_date?'assigned_date':rows[0]?.date?'date':rows[0]?.updated_at?'updated_at':'created_at');let selected=rows.filter(r=>(r.teacher_id===teacherId||r.linked_id===teacherId)&&String(r[dateField]||'').slice(0,10)>=start&&String(r[dateField]||'').slice(0,10)<=end);if(metric.filter_field&&metric.filter_value!==undefined&&metric.filter_value!=='')selected=selected.filter(r=>String(r[metric.filter_field])===String(metric.filter_value));let aggregate=selected.length;if(metric.aggregation==='average'&&metric.field){const vals=selected.map(r=>Number(r[metric.field])).filter(Number.isFinite);aggregate=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;}else if(metric.aggregation==='sum'&&metric.field){aggregate=selected.reduce((a,r)=>a+n(r[metric.field]),0);}else if(metric.aggregation==='percentage'&&metric.field){aggregate=selected.length?selected.filter(r=>!!r[metric.field]).length/selected.length*100:0;}
  if(metric.method==='count_target'){const target=n(metric.target)||1;percent=Math.min(100,aggregate/target*100);value={source:table,records:selected.length,aggregate,target};}
  else if(metric.method==='percentage'){const target=n(metric.target)||100;percent=metric.aggregation==='percentage'?aggregate:Math.min(100,aggregate/target*100);value={source:table,records:selected.length,aggregate,target};}
  else if(metric.method==='threshold'){const hit=(metric.thresholds||[]).find(b=>aggregate>=n(b.min??0)&&aggregate<=n(b.max??999999999));percent=hit?n(hit.score_percent):0;value={source:table,records:selected.length,aggregate,thresholds:metric.thresholds||[]};}
  else if(metric.method==='deduction'){percent=Math.max(0,100-selected.length*n(metric.deduction_per_event??1));value={source:table,records:selected.length,deduction_per_event:n(metric.deduction_per_event??1)};}
  detail=selected.map(r=>({id:r.id,date:r[dateField],field:metric.field?r[metric.field]:undefined,status:r.status||undefined,feature:r.feature||undefined}));note='Calculated from the configured source table, date field, aggregation and filters. Validate these settings before publishing.';

 if(percent!==null&&percent!==undefined){const target=n(metric.target??100);const achieved=metric.method==='count_target'?Math.min(100,percent):Math.min(100,percent);const points=n(metric.weight)*achieved/100;return {metric_id:metric.id,name:metric.name,weight:n(metric.weight),score_percent:achieved,points,value,detail,note,coverage};}
 return {metric_id:metric.id,name:metric.name,weight:n(metric.weight),score_percent:null,points:0,value,detail,note,coverage};

function scoreTeacher(teacherId,period,cfg){const metrics=metricList(cfg);const results=metrics.map(m=>metricResult(m,teacherId,period.start_date,period.end_date));const cats=(cfg.categories||[]).map(c=>{const subs=categorySubs(c).map(sc=>{const rs=results.filter(r=>metrics.find(m=>m.id===r.metric_id)?.subcategory_id===sc.id);return {subcategory_id:sc.id,name:sc.name,weight:n(sc.weight),points:rs.reduce((a,r)=>a+r.points,0),metrics:rs};});return {category_id:c.id,name:c.name,weight:n(c.weight),points:subs.reduce((a,s)=>a+s.points,0),subcategories:subs};});const score=cats.reduce((a,c)=>a+c.points,0);const pending=results.filter(r=>r.coverage==='admin_review'||r.coverage==='manual').length;const rating=(cfg.rating_bands||[]).find(b=>score>=n(b.min)&&score<=n(b.max))?.label||'Not rated';return {teacher_id:teacherId,total_score:Math.round(score*100)/100,rating,category_scores:cats,evidence_snapshot:{generated_at:new Date().toISOString(),period:{start_date:period.start_date,end_date:period.end_date},frequency_history_available_from:source.teacher_appraisal_frequency_history.reduce((m,x)=>x.changed_at<m?x.changed_at:m,'9999'),pending_admin_metrics:pending,methodology_version:2},config_snapshot:cfg};}
async function ensurePeriod(type,start,end,label){const found=periods.find(p=>p.start_date===start&&p.end_date===end&&p.period_type===type);if(found)return found;if(!config)throw new Error('Publish an appraisal configuration first.');const r=await sb.from('teacher_appraisal_periods').insert({period_type:type,label:label||type+' '+start+' to '+end,start_date:start,end_date:end,config_id:config.id,created_by:profile.id}).select().single();if(r.error)throw r.error;periods.unshift(r.data);selectedPeriod=r.data.id;return r.data;}

async function refreshAppraisal(id){const a=appraisals.find(x=>x.id===id);if(!a||a.status==='finalised')return;const p=periods.find(x=>x.id===a.period_id);const sc=scoreTeacher(a.teacher_id,p,a.config_snapshot?.config||config.config);const r=await sb.from('teacher_appraisals').update({total_score:sc.total_score,rating:sc.rating,category_scores:sc.category_scores,evidence_snapshot:sc.evidence_snapshot,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;await loadAppraisals();}
async function saveManualMetric(metricId,percent,observation){const a=activeAppraisal;if(!a)return;const cats=JSON.parse(JSON.stringify(a.category_scores||[]));let target=null;cats.forEach(c=>(c.subcategories||[]).forEach(sc=>(sc.metrics||[]).forEach(m=>{if(m.metric_id===metricId)target=m;})));if(!target)return;const pct=Math.max(0,Math.min(100,n(percent)));target.score_percent=pct;target.points=Math.round(target.weight*pct/100*100)/100;target.manual_observation=observation||'';target.coverage='admin_assessed';cats.forEach(c=>{(c.subcategories||[]).forEach(sc=>{sc.points=(sc.metrics||[]).reduce((x,m)=>x+n(m.points),0);});c.points=(c.subcategories||[]).reduce((x,sc)=>x+n(sc.points),0);});const total=cats.reduce((sum,c)=>sum+n(c.points),0);const cfg=a.config_snapshot?.config||config.config;const rating=(cfg.rating_bands||[]).find(b=>total>=n(b.min)&&total<=n(b.max))?.label||'Not rated';const r=await sb.from('teacher_appraisals').update({category_scores:cats,total_score:Math.round(total*100)/100,rating,updated_at:new Date().toISOString()}).eq('id',a.id);if(r.error)throw r.error;await loadAppraisals();activeAppraisal=appraisals.find(x=>x.id===a.id);auditRows=await all('teacher_appraisal_audit','*',[['eq','appraisal_id',a.id]]);toast('Admin assessment saved.');render();}

entById(\'overallObs\').value).then(()=>saveObservation(\''+a.id+'\',\'recommendation\',document.getElementById(\'recommendation\').value))">Save observations</button></div>';}
function validateConfig(c){if(!Array.isArray(c.categories)||!c.categories.length)throw new Error('Add at least one category.');let sum=0,ids=new Set();c.categories.forEach(cat=>{if(!cat.id||!cat.name)throw new Error('Every category needs an ID and name.');if(ids.has(cat.id))throw new Error('Duplicate category ID: '+cat.id);ids.add(cat.id);const subs=categorySubs(cat);if(!subs.length)throw new Error('Every category needs at least one subcategory.');let subSum=0;subs.forEach(sc=>{if(!sc.id||!sc.name)throw new Error('Every subcategory needs an ID and name.');if(ids.has(sc.id))throw new Error('Duplicate subcategory ID: '+sc.id);ids.add(sc.id);if(!Array.isArray(sc.metrics)||!sc.metrics.length)throw new Error('Every subcategory needs at least one metric.');let metricSum=0;sc.metrics.forEach(m=>{if(!m.id||!m.name)throw new Error('Every metric needs an ID and name.');if(ids.has(m.id))throw new Error('Duplicate metric ID: '+m.id);ids.add(m.id);if(!Number.isFinite(Number(m.weight))||Number(m.weight)<0)throw new Error('Metric weight must be zero or greater.');metricSum+=Number(m.weight);});if(Math.abs(metricSum-Number(sc.weight))>.01)throw new Error('Metrics under '+sc.name+' must total exactly the subcategory weight.');subSum+=Number(sc.weight);});if(Math.abs(subSum-Number(cat.weight))>.01)throw new Error('Subcategories under '+cat.name+' must total exactly the category weight.');sum+=Number(cat.weight);});if(Math.abs(sum-100)>.01)throw new Error('All category weights must total exactly 100.');if(!Array.isArray(c.rating_bands)||!c.rating_bands.length)throw new Error('Define rating bands.');return true;}
function renderSetup(){if(!configDraft)return '<div class="card">No configuration found. Create a draft to begin.</div>';const cats=configDraft.categories||[];return '<div class="card"><div class="toolbar"><h2 class="section-title">Teacher Appraisal Rules Engine</h2><span class="right"></span><span class="pill">Published v'+esc(config?.version||'—')+'</span><button class="btn" onclick="configDraft=JSON.parse(JSON.stringify(config.config));render()">Discard draft</button><button class="btn primary" onclick="saveConfigDraft()">Save draft</button></div><p class="hint">Configure the full hierarchy: category → subcategory → individual metric. Every level has independent weightage; metrics also define evidence sources, formulas, targets, deadlines, grace periods and deductions.</p><div class="grid"><div class="stat">Total category weight<b>'+cats.reduce((s,c)=>s+n(c.weight),0)+' / 100</b></div><div class="stat">Categories<b>'+cats.length+'</b></div><div class="stat">Subcategories<b>'+cats.reduce((s,c)=>s+categorySubs(c).length,0)+'</b></div><div class="stat">Individual criteria<b>'+metricList(configDraft).length+'</b></div></div><div class="row" style="margin:14px 0"><button class="btn" onclick="addCategory()">+ Add category</button><button class="btn" onclick="addMetric()">+ Add criterion</button><button class="btn" onclick="addRatingBand()">+ Add rating band</button><button class="btn" onclick="testConfig()">Test with a teacher</button><button class="btn primary" onclick="publishConfig()">Publish new version</button></div><div id="configMsg" class="hint"></div></div>'+cats.map((c,ci)=>'<div class="card"><div class="toolbar"><b>'+esc(c.name)+'</b><span class="right"></span><label style="margin:0">Category points <input type="number" value="'+n(c.weight)+'" onchange="configDraft.categories['+ci+'].weight=Number(this.value)"></label><button class="btn" onclick="renameCategory('+ci+')">Edit name</button><button class="btn danger" onclick="removeCategory('+ci+')">Remove</button></div>'+categorySubs(c).map((sc,si)=>'<div class="detail"><div class="toolbar"><b>'+esc(sc.name)+'</b><span class="right"></span><label style="margin:0">Subcategory points <input type="number" value="'+n(sc.weight)+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].weight=Number(this.value)"></label><button class="btn" onclick="renameSubcategory('+ci+','+si+')">Edit subcategory</button><button class="btn danger" onclick="removeSubcategory('+ci+','+si+')">Remove</button></div>'+(sc.metrics||[]).map((m,mi)=>'<div class="metric"><div class="metric-head"><b>'+esc(m.name)+'</b><span class="pill">'+n(m.weight)+' points</span></div><div class="metric-grid"><div><label>Weight</label><input type="number" value="'+n(m.weight)+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].weight=Number(this.value)"></div><div><label>Scoring method</label><select onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].method=this.value"><option '+(m.method==='percentage'?'selected':'')+' value="percentage">Percentage</option><option '+(m.method==='timeliness_bands'?'selected':'')+' value="timeliness_bands">Timeliness bands</option><option '+(m.method==='count_target'?'selected':'')+' value="count_target">Count target</option><option '+(m.method==='admin_review'?'selected':'')+' value="admin_review">Admin assessed</option><option '+(m.method==='threshold'?'selected':'')+' value="threshold">Threshold</option><option '+(m.method==='deduction'?'selected':'')+' value="deduction">Deduction</option></select></div><div><label>Target</label><input type="number" value="'+(m.target??'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].target=Number(this.value)"></div><div><label>Deadline (hours)</label><input type="number" value="'+(m.deadline_hours??'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].deadline_hours=Number(this.value)"></div><div><label>Grace (hours)</label><input type="number" value="'+(m.grace_hours??'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].grace_hours=Number(this.value)"></div><div><label>Evidence source table</label><input value="'+esc(m.source||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].source=this.value"></div><div><label>Aggregation</label><select onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].aggregation=this.value"><option value="count" '+(m.aggregation==='count'?'selected':'')+'>Count</option><option value="percentage" '+(m.aggregation==='percentage'?'selected':'')+'>Percentage of rows</option><option value="average" '+(m.aggregation==='average'?'selected':'')+'>Average field</option><option value="sum" '+(m.aggregation==='sum'?'selected':'')+'>Sum field</option></select></div><div><label>Data field</label><input value="'+esc(m.field||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].field=this.value"></div><div><label>Filter field</label><input value="'+esc(m.filter_field||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].filter_field=this.value"></div><div><label>Filter value</label><input value="'+esc(m.filter_value||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].filter_value=this.value"></div><div><label>Date field</label><input value="'+esc(m.date_field||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].date_field=this.value"></div><div><label>Deduction per event</label><input type="number" value="'+(m.deduction_per_event??'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].deduction_per_event=Number(this.value)"></div></div><label>Criterion description / scoring instructions</label><input style="width:100%" value="'+esc(m.description||'')+'" onchange="configDraft.categories['+ci+'].subcategories['+si+'].metrics['+mi+'].description=this.value"><div class="row" style="margin-top:8px"><button class="btn" onclick="renameMetric('+ci+','+si+','+mi+')">Rename</button><button class="btn danger" onclick="removeMetric('+ci+','+si+','+mi+')">Remove</button></div></div>').join('')+'<button class="btn" onclick="addMetricToSubcategory('+ci+','+si+')">+ Add metric to this subcategory</button></div>').join('')+'<button class="btn" onclick="addSubcategory('+ci+')">+ Add subcategory</button></div>').join('')+'<div class="card"><h2 class="section-title">Advanced configuration (complete JSON)</h2><textarea id="configJson" class="config-json">'+esc(JSON.stringify(configDraft,null,2))+'</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="loadConfigJson()">Apply JSON edits</button><button class="btn" onclick="downloadConfig()">Export configuration JSON</button></div><p class="hint">Publishing requires category weights to total 100, subcategory weights to equal their parent category, and metric weights to equal their parent subcategory.</p></div>';}
function addCategory(){const name=prompt('New category name:');if(!name)return;const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString().slice(-4);configDraft.categories.push({id,name,weight:0,subcategories:[]});render();}
function addSubcategory(ci){const name=prompt('New subcategory name:');if(!name)return;const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString().slice(-4);if(!configDraft.categories[ci].subcategories)configDraft.categories[ci].subcategories=[];configDraft.categories[ci].subcategories.push({id,name,weight:0,metrics:[]});render();}
function addMetric(){if(!configDraft.categories.length){toast('Add a category first.',true);return;}const ci=Number(prompt('Category number (1-'+configDraft.categories.length+'):')||'0')-1;if(!configDraft.categories[ci])return;const subs=categorySubs(configDraft.categories[ci]);const si=Number(prompt('Subcategory number (1-'+subs.length+'):')||'0')-1;if(!subs[si])return;addMetricToSubcategory(ci,si);}
function addMetricToSubcategory(ci,si){const name=prompt('New criterion name:');if(!name)return;const sc=configDraft.categories[ci].subcategories[si];const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString().slice(-4);sc.metrics.push({id,name,weight:0,method:'admin_review',source:'admin_assessment',description:'Admin assessed; evidence and observation required.'});render();}
function renameCategory(i){const v=prompt('Category name:',configDraft.categories[i].name);if(v)configDraft.categories[i].name=v;render();}
function removeCategory(i){if(!confirm('Remove this category and all its criteria from the draft?'))return;configDraft.categories.splice(i,1);render();}
function renameSubcategory(i,j){const sc=categorySubs(configDraft.categories[i])[j];const v=prompt('Subcategory name:',sc.name);if(v)sc.name=v;render();}
function removeSubcategory(i,j){if(!confirm('Remove this subcategory and all its criteria from the draft?'))return;configDraft.categories[i].subcategories.splice(j,1);render();}
function renameMetric(i,j,k){const v=prompt('Criterion name:',configDraft.categories[i].subcategories[j].metrics[k].name);if(v)configDraft.categories[i].subcategories[j].metrics[k].name=v;render();}
function removeMetric(i,j,k){if(!confirm('Remove this criterion from the draft?'))return;configDraft.categories[i].subcategories[j].metrics.splice(k,1);render();}
function addRatingBand(){const label=prompt('Rating band name:');if(!label)return;const min=Number(prompt('Minimum score:','0'));const max=Number(prompt('Maximum score:','100'));configDraft.rating_bands.push({label,min,max});render();}
function loadConfigJson(){try{const v=JSON.parse($('configJson').value);validateConfig(v);configDraft=v;toast('JSON configuration applied.');render();}catch(e){toast(e.message,true);}}
function testConfig(){try{validateConfig(configDraft);const choices=teachers.map((t,i)=>(i+1)+'. '+t.name).join('\\n');const ix=Number(prompt('Choose a teacher for a non-saving test preview:\\n'+choices,'1'))-1;if(!teachers[ix]){toast('Configuration is valid. Test preview was not run because no teacher was selected.');return;}const start=prompt('Test period start date (YYYY-MM-DD):',monthStart(dateNow()));const end=prompt('Test period end date (YYYY-MM-DD):',dateNow());if(!start||!end||end<start)throw new Error('Enter valid test dates.');const p={start_date:start,end_date:end};const result=scoreTeacher(teachers[ix].id,p,configDraft);const lines=result.category_scores.map(c=>c.name+': '+c.points.toFixed(2)+' / '+c.weight).join('\\n');alert('TEST PREVIEW — not saved\\n'+teachers[ix].name+'\\n'+start+' to '+end+'\\nProvisional score: '+result.total_score.toFixed(2)+' / 100\\n'+lines+'\\n\\nReview Admin-assessed metrics and data gaps before publishing.');toast('Test preview completed. No appraisal record was created.');}catch(e){toast(e.message,true);}}
async function saveConfigDraft(){try{validateConfig(configDraft);const latest=configs.reduce((m,x)=>Math.max(m,n(x.version)),0);const r=await sb.from('teacher_appraisal_configs').insert({name:'LIB Teacher Appraisal',version:latest+1,status:'draft',config:configDraft,created_by:profile.id,notes:'Admin-created draft'}).select().single();if(r.error)throw r.error;await loadConfig();configDraft=JSON.parse(JSON.stringify(r.data.config));toast('Draft saved as version '+r.data.version+'.');}catch(e){toast(e.message,true);}render();}
async function publishConfig(){try{validateConfig(configDraft);if(!confirm('Publish this scoring configuration as a new version? Existing appraisal periods and finalised snapshots will not change.'))return;const latest=configs.reduce((m,x)=>Math.max(m,n(x.version)),0);const old=configs.find(x=>x.status==='published');if(old){const up=await sb.from('teacher_appraisal_configs').update({status:'archived'}).eq('id',old.id);if(up.error)throw up.error;}const r=await sb.from('teacher_appraisal_configs').insert({name:'LIB Teacher Appraisal',version:latest+1,status:'published',effective_from:dateNow(),published_at:new Date().toISOString(),config:configDraft,created_by:profile.id,notes:'Published by Admin'}).select().single();if(r.error){if(old)await sb.from('teacher_appraisal_configs').update({status:'published'}).eq('id',old.id);throw r.error;}await loadConfig();configDraft=JSON.parse(JSON.stringify(config.config));toast('Published configuration v'+config.version+'.');}catch(e){toast(e.message,true);}render();}
function downloadConfig(){const blob=new Blob([JSON.stringify(configDraft,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lib-teacher-appraisal-config.json';a.click();URL.revokeObjectURL(a.href);}
function renderPeriods(){return '<div class="card"><h2 class="section-title">Appraisal periods</h2><div class="scroll"><table><tr><th>Period</th><th>Dates</th><th>Configuration</th><th>Status</th></tr>'+periods.map(p=>'<tr><td>'+esc(p.label)+'</td><td>'+p.start_date+' – '+p.end_date+'</td><td>'+esc(configs.find(c=>c.id===p.config_id)?.version||'—')+'</td><td>'+esc(p.status)+'</td></tr>').join('')+'</table></div></div>';}
function render(){const app=$('app');if(view==='setup'){app.innerHTML='<div class="nav"><button onclick="tab=\'setup\';render()" class="'+(tab==='setup'?'active':'')+'">Scoring Setup</button><button onclick="tab=\'periods\';render()" class="'+(tab==='periods'?'active':'')+'">Periods & Versions</button></div>'+(tab==='periods'?renderPeriods():renderSetup())+'<div id="msg" class="hint">'+esc(msg)+'</div>';return;}app.innerHTML='<div class="nav"><button class="'+(tab==='dashboard'||tab==='detail'?'active':'')+'" onclick="tab=\'dashboard\';activeAppraisal=null;render()">Appraisals</button><button class="'+(tab==='setup'?'active':'')+'" onclick="view=\'setup\';tab=\'setup\';render()">Configuration preview</button><button onclick="loadBase().then(loadPeriods).then(loadAppraisals).then(render)">Refresh data</button></div>'+(tab==='detail'?renderDetail()+renderAuditHistory():renderDashboard())+'<div id="msg" class="hint">'+esc(msg)+'</div>';}
async function init(){try{if(!window.supabase)throw new Error('Supabase library did not load.');sb=window.supabase.createClient(URL,KEY);const sess=await sb.auth.getSession();if(!sess.data.session)throw new Error('No active LIB login found. Please sign in to the main app first.');const p=await sb.from('profiles').select('id,role,archived,username').eq('id',sess.data.session.user.id).single();if(p.error||!p.data||p.data.role!=='Admin'||p.data.archived)throw new Error('Access denied. Teacher Appraisal is restricted to active Admin accounts.');profile=p.data;$('status').textContent='Authenticated as Admin';await Promise.all([loadConfig(),loadBase()]);await loadPeriods();await loadAppraisals();const params=new URLSearchParams(location.search);if(params.get('view')==='setup'){view='setup';tab='setup';}render();}catch(e){$('status').textContent='Access blocked';$('app').innerHTML='<div class="card"><h2>Teacher Appraisal unavailable</h2><p class="error">'+esc(e.message||String(e))+'</p><p class="hint">Sign in to the main LIB app with an active Admin account, then open this module again. Teacher, Student and Parent accounts cannot access appraisal records or setup.</p></div>';}}
Object.assign(window,{render,generatePeriod,loadAppraisals,loadPeriods,loadBase,loadConfig,toast,openAppraisal,refreshAppraisal,finalise,reopen,saveManualMetric,saveObservation,addCategory,addSubcategory,addMetric,addMetricToSubcategory,addRatingBand,testConfig,saveConfigDraft,publishConfig,renameCategory,removeCategory,renameSubcategory,removeSubcategory,renameMetric,removeMetric,loadConfigJson,downloadConfig,renderPeriods,printConsolidated});
Object.defineProperties(window,{
 selectedPeriod:{get:()=>selectedPeriod,set:v=>{selectedPeriod=v;}},
 tab:{get:()=>tab,set:v=>{tab=v;}},
 view:{get:()=>view,set:v=>{view=v;}},
 activeAppraisal:{get:()=>activeAppraisal,set:v=>{activeAppraisal=v;}},
 configDraft:{get:()=>configDraft,set:v=>{configDraft=v;}}
});
window.addEventListener('error',e=>console.error('Appraisal module error',e.error||e.message));
init();
})();
</script></body></html>
