name: Past Paper discovery archive tests

on:
  pull_request:
    paths:
      - "supabase/functions/past-paper-discovery/**"
      - ".github/workflows/past-paper-discovery-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/past-paper-discovery/**"

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run ZIP archive unit tests
        run: deno test supabase/functions/past-paper-discovery/archive_test.ts
      - name: Type-check Past Paper discovery Edge Function
        run: deno check supabase/functions/past-paper-discovery/index.ts
