name: Cloudflare static asset bundle

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/cloudflare-static-assets.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-static-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: Build and audit production asset bundle (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the complete static asset directory
        run: node scripts/build-cloudflare-assets.mjs

      - name: Check application JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist -type f -name '*.js' -print0)

      - name: Check inline application scripts in index.html
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, rmSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { readdirSync } from "node:fs";
          const htmlFiles = [];
          const walk = (dir) => {
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const full = `${dir}/${entry.name}`;
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith(".html")) htmlFiles.push(full);
            }
          };
          walk("dist");
          if (!htmlFiles.length) throw new Error("No HTML files found in dist");
          let checked = 0;
          for (const htmlFile of htmlFiles) {
            const html = readFileSync(htmlFile, "utf8");
            const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
              .filter((match) => !/\bsrc\s*=/i.test(match[1]) &&
                (!/\btype\s*=/i.test(match[1]) || /\btype\s*=\s*["']?(?:text\/javascript|module)/i.test(match[1])));
            scripts.forEach((match) => {
              const file = `/tmp/mylib-inline-${checked}.js`;
              writeFileSync(file, match[2]);
              try { execFileSync(process.execPath, ["--check", file], { stdio: "inherit" }); }
              finally { rmSync(file, { force: true }); }
              checked++;
            });
          }
          if (!checked) throw new Error("No inline application scripts found across dist HTML files");
          console.log(`Syntax-checked ${checked} inline script(s) across ${htmlFiles.length} HTML file(s).`);
          NODE

      - name: Validate Cloudflare static-assets configuration without deploying
        run: npx --yes wrangler@4.161.0 deploy --dry-run

      - name: Verify published bundle excludes backend and authoring sources
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/register.html
          test -f dist/question-bank/question-bank.html
          test ! -d dist/supabase
          test ! -d dist/guides-src
          if find dist -type f \( -name '*.sql' -o -name '*.ts' -o -name '*.py' -o -name '*.md' \) | grep -q .; then
            echo "Unexpected backend or authoring source found in dist."
            exit 1
          fi

      - name: Upload audited static asset bundle
        uses: actions/upload-artifact@v4
        with:
          name: mylib-cloudflare-static-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7
