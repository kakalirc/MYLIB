name: Knowledge Arena checks

on:
  pull_request:
    paths:
      - "supabase/functions/knowledge-arena/**"
      - "supabase/functions/knowledge-arena-worker/**"
      - "supabase/functions/past-paper-discovery/**"
      - "supabase/functions/qb-paper-extraction-*/**"
      - "past-paper-discovery.js"
      - "supabase/functions/_shared/knowledge-arena.ts"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "knowledge-arena/**"
      - "student-portal-tabs.js"
      - "student-portal-tabs.css"
      - ".github/workflows/knowledge-arena-check.yml"
      - ".github/workflows/build-user-guides.yml"
  push:
    branches:
      - "feature/knowledge-arena"
      - "feature/knowledge-arena-full-subject-games"
    paths:
      - "supabase/functions/knowledge-arena/**"
      - "supabase/functions/knowledge-arena-worker/**"
      - "supabase/functions/_shared/knowledge-arena.ts"
      - "supabase/config.toml"
      - "knowledge-arena/**"
      - "student-portal-tabs.js"
      - "student-portal-tabs.css"
      - ".github/workflows/knowledge-arena-check.yml"

permissions:
  contents: read

jobs:
  schema-smoke-test:
    name: Smoke-test proposed schema in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_arena_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowledge_arena_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable Supabase-compatible fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/schema-fixture.sql
      - name: Test guest lead migration in a separate disposable database
        run: |
          createdb --maintenance-db="$DATABASE_URL" guest_ci
          GUEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/guest_ci
          psql "$GUEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/schema-fixture.sql
          psql "$GUEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261109100000_knowledge_arena_guest_leads.sql
          psql "$GUEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261109150000_knowledge_arena_international_guest_numbers.sql
          psql "$GUEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261109160000_knowledge_arena_atomic_guest_registration.sql
          psql "$GUEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/guest-leads-smoke.sql
      - name: Test Past Paper Discovery migration in a separate disposable database
        run: |
          createdb --maintenance-db="$DATABASE_URL" past_paper_ci
          PAPER_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/past_paper_ci
          psql "$PAPER_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/past-paper-discovery-fixture.sql
          psql "$PAPER_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261112130000_past_paper_online_discovery.sql
          psql "$PAPER_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/past-paper-discovery-schema-smoke.sql
      - name: Test Question Bank extraction migrations in a disposable database
        run: |
          createdb --maintenance-db="$DATABASE_URL" qb_extraction_ci
          QB_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/qb_extraction_ci
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-fixture.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114150000_qb_paper_extraction_safety_gate.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114170000_qb_extraction_restartability.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114190000_qb_extraction_worker_lease.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114200000_qb_extraction_atomic_publish.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261114210000_qb_extraction_usd_cost_guard.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-paper-extraction-safety-gate-smoke.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-restartability-smoke.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-worker-lease-smoke.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-worker-smoke.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-publish-smoke.sql
          psql "$QB_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/qb-extraction-usd-cost-smoke.sql
      - name: Apply proposed Knowledge Arena schema to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/proposed-schema.sql
      - name: Test grade challenges, duplicate prevention, worker lease and grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/schema-smoke.sql
      - name: Test Knowledge Arena usage tracking migration and private access
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113230000_knowledge_arena_usage_tracking.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT (SELECT relrowsecurity FROM pg_class WHERE oid='public.ka_usage_events'::regclass) THEN
              RAISE EXCEPTION 'ka_usage_events must have RLS enabled';
            END IF;
            IF has_table_privilege('anon','public.ka_usage_events','SELECT') OR
               has_table_privilege('authenticated','public.ka_usage_events','SELECT') OR
               has_table_privilege('authenticated','public.ka_usage_events','INSERT') THEN
              RAISE EXCEPTION 'Browser roles must not access ka_usage_events directly';
            END IF;
            IF NOT has_table_privilege('service_role','public.ka_usage_events','INSERT') OR
               NOT has_table_privilege('service_role','public.ka_usage_events','SELECT') THEN
              RAISE EXCEPTION 'service_role must access ka_usage_events';
            END IF;
          END \$\$;"
      - name: Confirm schema preflight refuses a second application
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/proposed-schema.sql; then
            echo "Expected the preflight to reject an existing ka_* object."
            exit 1
          else
            echo "Preflight correctly refused a second application."
          fi

  deno-check:
    name: Type-check isolated Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Deno from the official npm distribution
        run: |
          npm install --global deno@2.9.6
          deno --version
      - name: Type check Student/Teacher/Admin API
        run: deno check supabase/functions/knowledge-arena/index.ts
      - name: Type check generation worker
        run: deno check supabase/functions/knowledge-arena-worker/index.ts
      - name: Type check Past Paper Discovery API
        run: deno check supabase/functions/past-paper-discovery/index.ts
      - name: Type check Question Bank extraction worker
        run: deno check supabase/functions/qb-paper-extraction-worker/index.ts
      - name: Type check Question Bank review API
        run: deno check supabase/functions/qb-paper-extraction-review/index.ts
      - name: Test game catalogue and subject routing
        run: deno test supabase/functions/_shared/knowledge-arena_test.ts
      - name: Test AI JSON response parsing and malformed-output handling
        run: deno test supabase/functions/knowledge-arena-worker/json-response_test.ts
      - name: Parse browser JavaScript
        run: |
          node --check knowledge-arena/knowledge-arena.js
          node --check student-portal-tabs.js
          node --check past-paper-discovery.js
