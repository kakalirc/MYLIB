name: Knowledge Arena checks

on:
  pull_request:
    paths:
      - "supabase/functions/knowledge-arena/**"
      - "supabase/functions/knowledge-arena-worker/**"
      - "supabase/functions/_shared/knowledge-arena.ts"
      - "knowledge-arena/**"
      - "student-portal-tabs.js"
      - "student-portal-tabs.css"
      - ".github/workflows/knowledge-arena-check.yml"
  push:
    branches:
      - "feature/knowledge-arena"
    paths:
      - "supabase/functions/knowledge-arena/**"
      - "supabase/functions/knowledge-arena-worker/**"
      - "supabase/functions/_shared/knowledge-arena.ts"
      - "knowledge-arena/**"
      - "student-portal-tabs.js"
      - "student-portal-tabs.css"
      - ".github/workflows/knowledge-arena-check.yml"

permissions:
  contents: read

jobs:
  schema-smoke-test:
    name: Smoke-test proposed schema in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_arena_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowledge_arena_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable Supabase-compatible fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/schema-fixture.sql
      - name: Apply proposed Knowledge Arena schema to disposable database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/proposed-schema.sql
      - name: Test grade challenges, duplicate prevention, worker lease and grants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/tests/schema-smoke.sql
      - name: Confirm schema preflight refuses a second application
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f knowledge-arena/proposed-schema.sql; then
            echo "Expected the preflight to reject an existing ka_* object."
            exit 1
          else
            echo "Preflight correctly refused a second application."
          fi

  deno-check:
    name: Type-check isolated Edge Functions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Student/Admin API
        run: deno check supabase/functions/knowledge-arena/index.ts
      - name: Type check generation worker
        run: deno check supabase/functions/knowledge-arena-worker/index.ts
      - name: Test AI JSON response parsing and malformed-output handling
        run: deno test supabase/functions/knowledge-arena-worker/json-response_test.ts
      - name: Parse browser JavaScript
        run: |
          node --check knowledge-arena/knowledge-arena.js
          node --check student-portal-tabs.js
