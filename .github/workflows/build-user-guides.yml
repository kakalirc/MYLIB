name: Build user guide PDFs

on:
  pull_request:
    paths:
      - "guides-src/**"
      - ".github/workflows/build-user-guides.yml"

permissions:
  contents: read

concurrency:
  group: build-user-guides-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-guides:
    name: Regenerate and validate role-based PDF guides
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install pypdf
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Regenerate all four guides
        run: python guides-src/build.py
      - name: Upload regenerated PDFs for review
        uses: actions/upload-artifact@v4
        with:
          name: role-based-user-guides
          path: |
            guide-teacher.pdf
            guide-student.pdf
            guide-parent.pdf
            guide-admin.pdf
          if-no-files-found: error
